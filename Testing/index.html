<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">
    <a href="../Extra/about.html">
        <img class="title-logo" src="../BQX assets/Main Page/BirdQuestX Title.png" alt="BirdQuestX Title">
    </a>

    <a href="game/game.html">
        <img class="title-logo" src="../BQX assets/Main Page/Start.png" alt="Start Game">
    </a>
</div>

<audio id="main-music" src="../BQX assets/music/Pixel Feathers.mp3" loop></audio>

<script>
    const mainMusic = document.getElementById("main-music");

    document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "l") {
            if (mainMusic.paused) {
                mainMusic.play();
            } else {
                mainMusic.pause();
            }
        }

        if (event.key.toLowerCase() === "p") {
            window.location.href = "../Game/Beta/Beta Testing Pick.html";
        }
    });
</script>

</html>
