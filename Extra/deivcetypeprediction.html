<body>
  
    <script>
        function isMobileDevice() {
            const mobilePattern = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
            return mobilePattern.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        const mobile = isMobileDevice();
        const deviceType = mobile ? "Mobile Device Detected" : "PC Device Detected";
        const destination = mobile ? "../Game/Game(Mobile).html" : "../Game/Game(PC).html";

        document.getElementById("device-type").textContent = deviceType;
        document.getElementById("redirect-text").textContent = "Opening " + destination;

        setTimeout(function () {
            window.location.href = destination;
        }, 1200);
    </script>
</body>
