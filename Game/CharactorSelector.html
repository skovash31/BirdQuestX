
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Character Selector</title>
    <link rel="stylesheet" href="../CSS/BattleStyleMenu.css">
</head>
<body>

<h1></h1>
<audio id="main-music" src="../BQX assets/music/Bird Bath.mp3" loop></audio>

<script>
    const mainMusic = document.getElementById("main-music");

    document.addEventListener("keydown", function (event) {
        if (event.key.toLowerCase() === "l") {
            if (mainMusic.paused) {
                mainMusic.play();
            } else {
                mainMusic.pause();
            }
        }
    });
</script>

</body>
</html>
